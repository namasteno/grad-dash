<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#001731">
<title>Grad Dash · WGU</title>
<style>
  :root { --midnight:#001731; --blue:#002855; --mblue:#0070F0; --lime:#97E152; }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100%; background: var(--midnight); overflow: hidden;
    touch-action: none; -webkit-user-select: none; user-select: none;
    -webkit-tap-highlight-color: transparent;
    font-family: 'Futura PT', Futura, 'Century Gothic', Arial, sans-serif;
  }
  body { display: flex; align-items: center; justify-content: center; }
  canvas { display: block; touch-action: none; outline: none; }
  #lb[hidden] { display: none; }
  #lb { position: fixed; inset: 0; z-index: 10; display: flex; align-items: center; justify-content: center;
        background: rgba(0,23,49,.78); padding: 16px; touch-action: pan-y; }
  #lb .card { background: #fff; color: var(--midnight); border: 4px solid var(--blue); border-radius: 20px;
        width: 100%; max-width: 340px; max-height: 94vh; overflow-y: auto; padding: 20px 20px 18px; text-align: center; }
  #lb img.logo { width: 130px; height: auto; display: block; margin: 0 auto 10px; }
  #lb h2 { margin: 0 0 4px; font-size: 26px; color: var(--blue); letter-spacing: .2px; }
  #lb p { margin: 0 0 14px; font-size: 15px; line-height: 1.35; color: var(--blue); }
  #lb label { display: block; text-align: left; font-size: 13px; font-weight: 700; color: var(--blue); margin: 0 0 6px; }
  #lb input { width: 100%; height: 48px; border: 3px solid var(--blue); border-radius: 12px; padding: 0 14px;
        font: 700 18px 'Futura PT', Futura, 'Century Gothic', Arial, sans-serif; color: var(--midnight);
        -webkit-user-select: text; user-select: text; outline: none; }
  #lb input:focus { border-color: var(--mblue); box-shadow: 0 0 0 3px rgba(0,112,240,.25); }
  #lb .err { min-height: 20px; margin: 8px 0 2px; font-size: 14px; font-weight: 700; color: var(--blue); text-align: left; }
  #lb button { font: 700 19px 'Futura PT', Futura, 'Century Gothic', Arial, sans-serif; cursor: pointer; border: 0; }
  #lb .btn { display: block; width: 100%; height: 48px; border-radius: 24px; background: var(--mblue); color: #fff; margin-top: 8px; }
  #lb .btn:disabled { opacity: .6; cursor: default; }
  #lb .link { background: none; color: var(--blue); font-size: 15px; margin-top: 10px; padding: 8px; text-decoration: underline; }
  #lb .rows { margin: 4px 0 8px; text-align: left; }
  #lb .row { display: grid; grid-template-columns: 30px 1fr auto; align-items: center; gap: 8px; padding: 9px 10px;
        border-radius: 10px; font-size: 16px; font-weight: 700; }
  #lb .row:nth-child(odd) { background: #EEF6F9; }
  #lb .row.you { background: var(--lime); color: var(--midnight); }
  #lb .row .nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #lb .row .rs { font-variant-numeric: tabular-nums; }
  #lb .head { font-size: 12px; font-weight: 700; color: var(--blue); display: grid; grid-template-columns: 30px 1fr auto; gap: 8px; padding: 0 10px 4px; text-align: left; }
  #lb .gap { text-align: center; color: var(--blue); font-size: 18px; line-height: 14px; }
  #lb .meta { font-size: 13px; color: var(--blue); margin: 6px 0 4px; }
  @media (min-width: 640px) and (min-height: 700px) {
    canvas { border-radius: 14px; box-shadow: 0 0 0 3px var(--blue), 0 20px 80px rgba(0,112,240,.28); }
  }
</style>

/* ---------- Canvas ---------- */
const W = 360, H = 640, CX = W / 2, CY = 330, R = 108, TRACK = 30;
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
let k = 1;
function resize() {
  const s = Math.min(innerWidth / W, innerHeight / H);
  const dpr = Math.min(devicePixelRatio || 1, 3);
  cv.style.width = W * s + 'px'; cv.style.height = H * s + 'px';
  cv.width = Math.round(W * s * dpr); cv.height = Math.round(H * s * dpr);
  k = cv.width / W;
}
addEventListener('resize', resize); resize();

/* ---------- Game state ---------- */
let state = 'ready';              // ready | play | dead
let paused = false, muted = false;
const RING = 50;                  // one lap of the ring = one degree
let pops = 0, bestPops = 0, newBest = false, runStart = 0, runTime = 0, capT = 0;
let theta = -Math.PI / 2, dir = 1, omega = 2.7, tol = 0.23;
let target = 0, prevAhead = 0, crossed = false;
let prompted = false, overlayOpen = false, lastRun = null;
let tick = 0, deadT = 0, lockBump = 0, shake = 0, flash = 0, shackle = 0;
let trail = [], particles = [], floaters = [];
try {
  bestPops = parseInt(localStorage.getItem('wgu_graddash_pops') || '0', 10) || 0;
} catch (e) {}
const saveBest = () => { try {
  localStorage.setItem('wgu_graddash_pops', String(bestPops));
} catch (e) {} };

/* Difficulty ramps with every pop: faster needle, slightly smaller zone */
const SPEED_MAX = 6.3;                            // top speed, reached around pop 50, then it holds
const speedAt = n => Math.min(SPEED_MAX, 2.6 + n * 0.075);
const tolAt   = n => Math.max(0.19, 0.24 - n * 0.001);
const fmtTime = t => t.toFixed(1) + 's';
const mod = (a, n) => ((a % n) + n) % n;

/* ---------- Audio ---------- */
let ac = null;
function audioInit() {
  if (!ac) { try { ac = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} }
  if (ac && ac.state === 'suspended') ac.resume();
}
function beep(f, d, type, v, slide, delay) {
  if (muted || !ac) return;
  const t0 = ac.currentTime + (delay || 0), o = ac.createOscillator(), g = ac.createGain();

}

/* ---------- Input ---------- */

/* ---------- Update (fixed 60 Hz) ---------- */
function update() {

  if (shake > 0) shake = Math.max(0, shake - 0.4);
  if (lockBump > 0) lockBump = Math.max(0, lockBump - 0.09);

  if (state === 'ready') { theta += 0.012; }   // idle drift on title screen

  if (state === 'play') {
    theta += dir * omega / 60;
    trail.push(theta); if (trail.length > 10 + Math.floor(pops / 5)) trail.shift();
    const a = aheadNow();
    if (a - prevAhead > Math.PI) crossed = true;
    prevAhead = a;
    if (crossed && (TAU - a) > tol) fail();
  }
  if (capT > 0) {
    capT++;
    if (capT % 4 === 0 && capT < 70) {
      const cols = [C.lime, C.sky, C.white, C.mblue];
      for (let i = 0; i < 6; i++) {
        particles.push({ x: Math.random() * W, y: -10, vx: (Math.random() - 0.5) * 2, vy: 2 + Math.random() * 3,
          life: 110, r: 3 + Math.random() * 3, c: cols[i % cols.length] });
      }
    }
    if (capT > 104) capT = 0;
  }
  if (state === 'dead') {
    deadT++;
    if (deadT === 75 && pops > 0 && !prompted) { prompted = true; showEntry(); }
    if (trail.length) trail.shift();
  }
  particles.forEach(p => { p.x += p.vx; p.y += p.vy; p.vx *= 0.97; p.vy *= 0.97; p.life--; });
  particles = particles.filter(p => p.life > 0);
  floaters.forEach(f => { f.y -= 0.6; f.life--; });

}

/* ---------- Drawing ---------- */
function drawBg() {
  const g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, C.midnight); g.addColorStop(1, C.blue);
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  const rg = ctx.createRadialGradient(CX, CY, 20, CX, CY, 230);
  rg.addColorStop(0, 'rgba(0,112,240,.30)'); rg.addColorStop(1, 'rgba(0,112,240,0)');
  ctx.fillStyle = rg; ctx.fillRect(0, 0, W, H);

  ctx.lineCap = 'round';
  const lapPops = pops > 0 && pops % RING === 0 ? RING : pops % RING;
  for (let i = 0; i < RING; i++) {
    const a = -Math.PI / 2 + (i + 0.5) / RING * TAU, major = (i + 1) % 10 === 0;
    const [x1, y1] = pt(a, R + TRACK / 2 + 9), [x2, y2] = pt(a, R + TRACK / 2 + (major ? 24 : 19));
    const lit = i < lapPops;

    ctx.lineWidth = major ? 4 : 3;

}

function drawTrack() {
  ctx.lineWidth = TRACK; ctx.strokeStyle = 'rgba(0,112,240,.30)';
  ctx.beginPath(); ctx.arc(CX, CY, R, 0, TAU); ctx.stroke();
  ctx.lineWidth = 2; ctx.strokeStyle = 'rgba(70,177,239,.7)';

  ctx.beginPath(); ctx.arc(CX, CY, R - TRACK / 2, 0, TAU); ctx.stroke();
}

function drawMute() {

function render() {
  ctx.setTransform(k, 0, 0, k, 0, 0);
  ctx.save();
  if (shake > 0) ctx.translate((Math.random() - 0.5) * shake, (Math.random() - 0.5) * shake);

  drawBg(); drawTrack(); drawTarget(); drawNeedle(); drawMascot();

  particles.forEach(p => {
    ctx.globalAlpha = Math.min(1, p.life / 20); ctx.fillStyle = p.c;
    ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, TAU); ctx.fill();
  });

  floaters.forEach(f => {
    ctx.globalAlpha = Math.min(1, f.life / 15);
    text(f.t, f.x, f.y, f.size || 20, C.lime, 'center');
  });
  ctx.globalAlpha = 1;

  if (state === 'ready') drawReady();
  if (state === 'play') drawHud();
  if (state === 'dead') {

    drawEnd();
  }

  if (paused) {
    ctx.fillStyle = 'rgba(0,23,49,.7)'; ctx.fillRect(0, 0, W, H);

    ctx.lineWidth = 4; ctx.strokeStyle = C.blue; ctx.stroke();
    text('PAUSED', W / 2, H / 2 - 18, 30, C.blue, 'center');

  }

/* ---------- Loop ---------- */
const STEP = 1000 / 60;
let last = 0, acc = 0;
function frame(t) {
  if (!last) last = t;
  acc += Math.min(100, t - last); last = t;
  while (acc >= STEP) { if (!paused) update(); acc -= STEP; }
  render(); requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

function closeOverlay() { lbEl.hidden = true; overlayOpen = false; lbCard.replaceChildren(); cv.focus(); }
function show(...nodes) { lbCard.replaceChildren(...nodes); lbCard.scrollTop = 0; }

const cmp = (a, b) => (a.pops !== b.pops) ? b.pops - a.pops : a.time - b.time;
function localBoard(name) {
  let runs = []; try { runs = JSON.parse(lsGet(LOCAL_KEY) || '[]'); } catch (e) {}
  const best = {};
  runs.forEach(r => { const k = normName(r.name); if (!best[k] || cmp(r, best[k]) < 0) best[k] = r; });
  const ranked = Object.values(best).sort(cmp);
  const out = { ok: true, top: ranked.slice(0, 10), players: ranked.length, plays: runs.length, local: true };
  const i = ranked.findIndex(r => normName(r.name) === normName(name));
  if (name && i >= 0) out.you = Object.assign({ rank: i + 1 }, ranked[i]);
  return out;
}
async function postRun(run, name) {
  const payload = { name, pops: run.pops, time: Math.round(run.time * 10) / 10 };
  if (!LB_URL) {
    let runs = []; try { runs = JSON.parse(lsGet(LOCAL_KEY) || '[]'); } catch (e) {}
    runs.push(payload); lsSet(LOCAL_KEY, JSON.stringify(runs.slice(-300))); return;
  }
  // text/plain body = a "simple" request, so no CORS preflight (Apps Script can't answer one)
  await fetch(LB_URL, { method: 'POST', mode: 'no-cors', body: JSON.stringify(payload) });
}
async function fetchBoard(name) {
  if (!LB_URL) return localBoard(name);
  const ctl = new AbortController(), timer = setTimeout(() => ctl.abort(), 12000);
  try {
    const res = await fetch(LB_URL + '?action=top&name=' + encodeURIComponent(name || '') + '&t=' + Date.now(), { signal: ctl.signal });
    const data = await res.json();
    if (!data || !data.ok) throw new Error('bad response');
    return data;
  } finally { clearTimeout(timer); }
}
const resultText = r => String(r.pops);

function renderBoard(data, me, fromRun) {
  const rows = h('div', { class: 'rows' });
  const rowFor = (r, rank, you) => h('div', { class: 'row' + (you ? ' you' : '') },
    h('span', {}, rank), h('span', { class: 'nm' }, r.name), h('span', { class: 'rs' }, resultText(r)));
  const meKey = normName(me);
  data.top.forEach((r, i) => rows.append(rowFor(r, i + 1, meKey && normName(r.name) === meKey)));
  if (!data.top.length) rows.append(h('div', { class: 'meta', style: 'text-align:center;padding:14px 0' }, 'No scores yet. Be the first!'));
  if (data.you && data.you.rank > 10) {
    rows.append(h('div', { class: 'gap' }, '⋮'));
    rows.append(rowFor(data.you, data.you.rank, true));
  }
  const back = h('button', { class: 'btn', onclick: () => {
    closeOverlay();
    if (fromRun) { state = 'ready'; resetRun(); }
  } }, fromRun ? 'PLAY AGAIN' : 'CLOSE');
  show(
    logoImg(),
    h('h2', {}, 'LEADERBOARD'),
    h('p', {}, 'Most pops wins. Ties go to the faster run.'),
    h('div', { class: 'head' }, h('span', {}, '#'), h('span', {}, 'PLAYER'), h('span', {}, 'POPS')),
    rows,
    h('div', { class: 'meta' }, data.players + ' player' + (data.players === 1 ? '' : 's') + ' · ' + data.plays + ' run' + (data.plays === 1 ? '' : 's') +
      (data.local ? ' · this device only' : '')),
    back
  );
}

async function showBoard(me, fromRun) {
  openOverlay();
  const name = me || cleanName(lsGet(NAME_KEY) || '');
  show(logoImg(), h('h2', {}, 'LEADERBOARD'), h('p', {}, 'Loading…'));
  try {
    renderBoard(await fetchBoard(name), name, !!fromRun);
  } catch (e) {
    show(logoImg(), h('h2', {}, 'LEADERBOARD'),
      h('p', {}, "Couldn't reach the leaderboard. Check your connection and try again."),
      h('button', { class: 'btn', onclick: () => showBoard(me, fromRun) }, 'RETRY'),
      h('button', { class: 'link', onclick: () => { closeOverlay(); if (fromRun) { state = 'ready'; resetRun(); } } }, 'Close'));
  }
}

function showEntry() {
  const run = lastRun; if (!run || run.pops < 1) return;
  openOverlay();
  const input = h('input', { type: 'text', maxlength: '20', autocomplete: 'name', autocapitalize: 'words',
    placeholder: 'First name + last initial', 'aria-label': 'Your name', value: cleanName(lsGet(NAME_KEY) || '') });
  const err = h('div', { class: 'err', role: 'alert' });
  const submit = h('button', { class: 'btn' }, 'POST MY SCORE');
  const skip = h('button', { class: 'link', onclick: () => closeOverlay() }, 'Skip');
  const go = async () => {
    const name = cleanName(input.value);
    if (!name) { err.textContent = 'Enter a name to post your score.'; input.focus(); return; }
    lsSet(NAME_KEY, name); err.textContent = ''; submit.disabled = true; skip.disabled = true; submit.textContent = 'SAVING…';
    try {
      await postRun(run, name);
      if (LB_URL) await sleep(900);
      await showBoard(name, true);
    } catch (e) {
      submit.disabled = false; skip.disabled = false; submit.textContent = 'POST MY SCORE';
      err.textContent = "Couldn't save. Check your connection and try again.";
    }
  };
  submit.addEventListener('click', go);
  input.addEventListener('keydown', e => { e.stopPropagation(); if (e.key === 'Enter') go(); });
  show(
    logoImg(),
    h('h2', {}, run.pops >= RING ? 'DEGREE EARNED!' : 'NICE RUN!'),
    h('p', {}, run.pops + ' pop' + (run.pops === 1 ? '' : 's') + '. Post it to the board!'),
    h('label', { for: 'nm' }, 'YOUR NAME'),
    input, err, submit, skip
  );
  input.id = 'nm';
  setTimeout(() => { try { input.focus(); input.select(); } catch (e) {} }, 60);
}

window.__game = { get state() { return state; }, get pops() { return pops; }, get omega() { return omega; }, get overlay() { return overlayOpen; }, get inWindow() { return state === 'play' && inWindow(); }, action };
})();
</script>
